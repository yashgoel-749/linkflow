worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  log_format safe '$remote_addr $request_method $uri $status';
  access_log /dev/stdout safe;
  sendfile on;
  server_tokens off;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    location = /frontend-health { access_log off; return 200 'ok'; }
    location ~ (^|/)\. { return 404; }
    location ~ ^/(server|scripts|node_modules|design_reference)(/|$) { return 404; }
    location /assets/ { add_header Cache-Control 'public, max-age=31536000, immutable'; try_files $uri =404; }
    location = /index.html { add_header Cache-Control 'no-store'; }
    location / { add_header Cache-Control 'no-store'; try_files $uri $uri/ /index.html; }
  }
}
